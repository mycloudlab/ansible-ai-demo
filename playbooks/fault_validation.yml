- name: Reproduce registration failure using malformed email
  hosts: caixa_demo
  become: true
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: tasks/guard.yml
  tasks:
    - name: Submit fictional malformed email
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/people
        method: POST
        body_format: form-urlencoded
        body: {name: Pessoa Teste, email: email-invalido}
        status_code: 500
