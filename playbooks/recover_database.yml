- name: recover_database
  hosts: caixa_demo
  become: true
  gather_facts: false
  pre_tasks:
  - ansible.builtin.import_tasks: tasks/guard.yml
  tasks:
  - name: Start database cluster
    ansible.builtin.systemd_service:
      name: postgresql@16-main
      state: started
  - ansible.builtin.import_tasks: tasks/verify.yml
